<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background-color: #f4f7ff;
    }

    .container {
      width: 90%;
      max-width: 700px;
      margin: 50px auto;
      background-color: white;
      border: 1px solid #c9d7f2;
      border-radius: 12px;
      overflow: hidden;
    }

    /* 헤더 영역 */
    header {
      background-color: #dce8ff;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      color: #183b70;
    }

    header p {
      margin: 0;
    }

    /* 본문 영역 */
    main {
      padding: 25px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #todoInput {
      width: 100%;
      padding: 12px;
      border: 1px solid #b9c9e5;
      border-radius: 6px;
      font-size: 16px;
    }

    #addBtn {
      width: 90px;
      border: none;
      border-radius: 6px;
      background-color: #4f86e8;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #addBtn:hover {
      background-color: #356fcf;
    }

    /* 할 일 목록 */
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      border: 1px solid #d4deef;
      border-radius: 8px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid #e5e9f2;
    }

    li:last-child {
      border-bottom: none;
    }

    li span {
      flex: 1;
    }

    /* 완료된 할 일 */
    li.completed span {
      text-decoration: line-through;
      color: #999;
    }

    /* 삭제 버튼 */
    .delete-btn {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 18px;
    }

    /* 할 일이 없을 때 */
    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
      border: 1px solid #d4deef;
      border-radius: 8px;
    }

    /* 푸터 영역 */
    footer {
      background-color: #dce8ff;
      text-align: center;
      padding: 15px;
      color: #31537f;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 1. 헤더 영역 -->
    <header>
      <h1>To-Do List</h1>
      <p>오늘 할 일을 하나씩 완료해 보세요! 😊</p>
    </header>

    <!-- 2. 본문 영역 -->
    <main>

      <!-- 할 일 입력 -->
      <div class="input-area">
        <input
          type="text"
          id="todoInput"
          placeholder="할 일을 입력하세요"
        >

        <button id="addBtn">추가</button>
      </div>

      <!-- 할 일이 없을 때 -->
      <div id="emptyMessage" class="empty">
        아직 등록된 할 일이 없습니다.
      </div>

      <!-- 할 일 목록 -->
      <ul id="todoList"></ul>

    </main>

    <!-- 3. 푸터 영역 -->
    <footer>
      오늘도 좋은 하루 되세요! :)
    </footer>

  </div>


  <script>

    // 필요한 요소 가져오기
    const input = document.getElementById("todoInput");
    const addBtn = document.getElementById("addBtn");
    const todoList = document.getElementById("todoList");
    const emptyMessage = document.getElementById("emptyMessage");


    // 할 일이 없으면 안내 문구 표시
    function updateEmptyMessage() {

      if (todoList.children.length === 0) {
        emptyMessage.style.display = "block";
      } else {
        emptyMessage.style.display = "none";
      }

    }


    // 할 일 추가 함수
    function addTodo() {

      const text = input.value.trim();

      // 아무것도 입력하지 않았을 때
      if (text === "") {
        alert("할 일을 입력해주세요!");
        return;
      }


      // 새로운 목록 만들기
      const li = document.createElement("li");


      // 체크박스 만들기
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";


      // 할 일 글자 만들기
      const span = document.createElement("span");
      span.textContent = text;


      // 삭제 버튼 만들기
      const deleteBtn = document.createElement("button");

      deleteBtn.textContent = "🗑️";
      deleteBtn.className = "delete-btn";


      // 체크박스를 누르면 완료 표시
      checkbox.addEventListener("change", function () {

        li.classList.toggle("completed");

      });


      // 삭제 버튼을 누르면 삭제
      deleteBtn.addEventListener("click", function () {

        li.remove();

        updateEmptyMessage();

      });


      // 목록에 요소 넣기
      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteBtn);

      todoList.appendChild(li);


      // 입력창 비우기
      input.value = "";

      input.focus();


      // 안내 문구 업데이트
      updateEmptyMessage();

    }


    // 추가 버튼을 누르면 실행
    addBtn.addEventListener("click", addTodo);


    // Enter 키를 눌러도 추가
    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        addTodo();
      }

    });


    // 처음 실행할 때 안내 문구 표시
    updateEmptyMessage();

  </script>

</body>
</html>
